# Download sources
sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

# You can specify local directories as sources also.
# - type: local
#   path: path/to/your/local/repository

# A directory to install the downloaded RBSs
path: .gem_rbs_collection

# gems:
#   # If you want to avoid installing rbs files for gems, you can specify them here.
#   - name: GEM_NAME
#     ignore: true

gems:
  - name: prism
    ignore: true
  - name: simplecov
    ignore: true
  - name: rspec
    ignore: true
  - name: rspec-core
    ignore: true
  - name: rspec-expectations
    ignore: true
  - name: rspec-mocks
    ignore: true
  - name: rspec-support
    ignore: true
  - name: rubocop
    ignore: true
  - name: rubocop-ast
    ignore: true
  - name: rubocop-performance
    ignore: true
  - name: rubocop-rails
    ignore: true
  - name: rubocop-rails-omakase
    ignore: true
  - name: rubocop-rspec
    ignore: true
  - name: faker
    ignore: true
  - name: steep
    ignore: true
  - name: rbs
    ignore: true
